name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen   # CI 无交互桌面，用 offscreen 跑 Qt
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest test_startup test_features test_interaction test_domains test_knowledge test_tm test_domain_integration
