[package]
name = "dongyi-trigger"
version = "0.1.0"
edition = "2024"
description = "懂译触发：全局鼠标/键盘低级钩子（trigger.py 忠实移植），回调只投递事件"

[dependencies]
log = "0.4"
serde = { workspace = true }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
