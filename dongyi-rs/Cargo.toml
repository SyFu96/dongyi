# 懂译 Rust 版工作区：src-tauri 为应用壳，crates/* 为领域 crate
[workspace]
resolver = "2"
members = ["src-tauri", "crates/dongyi-core", "crates/dongyi-capture", "crates/dongyi-trigger", "crates/dongyi-llm", "crates/dongyi-knowledge"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布体积优化（原 src-tauri 配置上移，workspace 统一生效）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

